<!DOCTYPE html>
<html lang="en">
<head>
<!-- Elegant Victorian-style fonts -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<title>Abi, I love you 💜</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: 'Playfair Display', serif; /* Elegant serif font */
  color: #eae0d5; /* Soft, warm parchment color */
  margin: 0;
  height: 100vh;
  /* Deep Victorian green to deep purple gradient */
  background: linear-gradient(135deg, #1b3022, #291b30);
  background-image: 
    radial-gradient(circle at top left, rgba(142, 114, 189, 0.2) 0%, transparent 50%),
    radial-gradient(circle at bottom right, rgba(46, 77, 60, 0.5) 0%, transparent 50%);
  display: flex;
  align-items: center;
  justify-content: center;
}

/* CARD STYLING */
.card {
  width: 340px;
  min-height: 480px;
  /* Rich wisteria purple and forest green mix */
  background: linear-gradient(145deg, #3a2845, #1e3329);
  border: 2px solid #b89947; /* Antique gold border */
  border-radius: 12px;
  padding: 30px;
  box-shadow: 0 0 40px rgba(184, 153, 71, 0.2), inset 0 0 15px rgba(0,0,0,0.5);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  text-align: center;
  cursor: pointer;
  transition: transform 0.4s ease, box-shadow 0.4s ease;
  position: relative;
  overflow: hidden;
}

.card:hover {
  transform: translateY(-5px);
  box-shadow: 0 0 50px rgba(184, 153, 71, 0.3), inset 0 0 20px rgba(0,0,0,0.6);
}

/* Corner decorations for an exclusive Victorian feel */
.card::before, .card::after {
  content: "❧"; /* Antique leaf flourish */
  position: absolute;
  color: #b89947;
  font-size: 24px;
  opacity: 0.6;
}
.card::before { top: 10px; left: 15px; }
.card::after { bottom: 10px; right: 15px; transform: rotate(180deg); }

h2 {
  font-family: 'Great Vibes', cursive; /* Romantic script font */
  font-size: 2.4rem;
  color: #d4c1ed; /* Soft wisteria purple */
  margin: 0 0 10px 0;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
}

#text {
  font-size: 1.15rem;
  line-height: 1.6;
  font-style: italic;
  margin-top: 15px;
}

/* Add tiny floating leaves/wisteria instead of standard hearts */
.card p::after {
  content: " 🌿";
  display: inline-block;
  animation: floatLeaves 2.5s infinite alternate ease-in-out;
}

@keyframes floatLeaves {
  from { transform: translateY(0) rotate(0deg); }
  to { transform: translateY(-4px) rotate(10deg); }
}

/* COUNTER */
#counter {
  font-family: 'Cinzel', serif;
  font-size: 0.8rem;
  color: #b89947; /* Antique gold */
  letter-spacing: 1px;
  margin-bottom: 10px;
}

/* IMAGE AREA */
#images img {
  width: 120px;
  height: 120px;
  object-fit: cover;
  border-radius: 50%;
  border: 3px solid #b89947; /* Gold frame around pictures */
  margin: 15px auto;
  display: block;
  box-shadow: 0 0 20px rgba(142, 114, 189, 0.5); /* Wisteria glow */
}

/* HEART SHAPE (styled like an antique cameo) */
.heart {
  width: 100px;
  height: 100px;
  margin: 15px auto;
  background: #8e72bd; /* Wisteria purple */
  clip-path: polygon(50% 90%, 100% 40%, 75% 10%, 50% 25%, 25% 10%, 0 40%);
  filter: drop-shadow(0 0 10px rgba(184, 153, 71, 0.4));
}

/* TAP TEXT */
.tap {
  font-family: 'Cinzel', serif;
  font-size: 0.75rem;
  letter-spacing: 2px;
  color: #b89947;
  opacity: 0.8;
  margin-top: 15px;
}
</style>
</head>

<body>

<div class="card" id="card">
  <h2 id="title">Abi, I love you 💜</h2>
  <div id="counter">💌 4 cards left</div>

  <div id="images">
    <div class="heart"></div>
  </div>

  <p id="text">
    You already know who this is from... Obviously, its me! I want us to forever be happy with each other, I'll do everything for that, my love.
  </p>

  <div class="tap">Tap to open</div>
</div>

<script>
const cards = [
  {
    title: "Abi, I love you 💜",
    text: "You already know who this is from... Obviously, its me! I want us to forever be happy with each other, I'll do everything for that, my love.",
    images: []
  },
  {
    title: "Abi, I love you 💚",
    text: "I wish the words were enough to tell you how much I love you. That's impossible but I promise you, that I will do everything, EVERYTHING to always and forever keep you with me and make you the happiest girl in the universe, my love I love you SO MUCH!",
    images: ["images/1.jpg.jpg"]
  },
  {
    title: "Abi, I love you 💜",
    text: "My love, I know sometimes I can be really jealous, but I promise you, it's because I love you so much. You showed me, you gave me the whole world just by coming into my life, you gave my life a purpose, you showed me what real, true love is and I will NEVER, EVER let something bad happen to us. No matter what happens, we're always gonna find a way to stay together and don't let anything get in our way. I'll do anything for you, I'll give you the whole world my love I can sacrifice everything for you, so we can still and always be together! <3",
    images: ["images/2.jpg.jpg"]
  },
  {
    title: "Abi, I love you 💚",
    text: "Even at the very beginning, I was feeling something with you. I loved how we both loved always spending time with each other, even at the very beginning. It feels like we were destined to be together since the very beginning of when we were born and even at the very beginning of when the universe was created. It felt like the 2 souls that are bound for each other, finally found each other and now there's no way of something to get in their way, they're already spending their whole day with each other, that's all they want, is to always be with each other and that makes them the happiest ever.",
    images: ["images/3.jpg.jpg"]
  },
  {
    title: "Abi, I love you 💜",
    text: "I promise you that no matter what happens, I'll always choose to be with you, always make you the happiest in the whole universe. If I need to sacrifice whole universe for you and to be with you, I'll do it. I'll do everything for you my love, my baby, my universe and let's promise that no matter what happens, we'll talk about everything and always, ALWAYS choose to be with each other, no matter what. My love for you is infinite, even more than that, it's breaking the laws of physics and everything. I love you so so so so muchhhhh!!! MWAHHHHH. ALWAYS and FOREVER TOGETHER",
    images: []
  }
];

let i = 0;

const titleEl = document.getElementById("title");
const textEl = document.getElementById("text");
const imagesEl = document.getElementById("images");
const counterEl = document.getElementById("counter");
const card = document.getElementById("card");

function updateCounter() {
  const left = cards.length - i - 1;
  if (left > 0) {
    counterEl.innerText = `💌 ${left} card${left > 1 ? "s" : ""} left`;
  } else {
    counterEl.style.display = "none";
  }
}

function renderCard() {
  const c = cards[i];
  titleEl.innerText = c.title;
  textEl.innerText = c.text;
  imagesEl.innerHTML = "";

  if (c.images.length > 0) {
    c.images.forEach(src => {
      const img = document.createElement("img");
      img.src = src;
      img.onerror = () => img.remove(); // fails safely
      imagesEl.appendChild(img);
    });
  } else {
    const heart = document.createElement("div");
    heart.className = "heart";
    imagesEl.appendChild(heart);
  }

  updateCounter();
}

card.onclick = () => {
  if (i < cards.length - 1) {
    i++;
    renderCard();
  }
};

renderCard();
</script>

</body>
</html>
